[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11

[window]
padding.x = 14
padding.y = 14
decorations = "None"
dynamic_padding = true

# Catppuccin Mocha (inlined so no theme daemon is needed)
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#ffffff"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

# Red "[line/total]" badge while vi mode is active.
[colors.line_indicator]
foreground = "#1e1e2e"
background = "#f38ba8"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#a6adc8"

[colors.dim]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#94e2d5"
white = "#bac2de"

[keyboard]
bindings = [
# Vi mode: tint the window background while it is active. There is no native
# option, so the toggle keys also run vi-mode-bg.sh, which flips a runtime
# colors.primary.background override over the IPC socket.
{ key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
{ key = "Space", mods = "Control|Shift", command = { program = "sh", args = ["-c", "exec \"$HOME/.config/alacritty/vi-mode-bg.sh\""] } },
# "i" leaves vi mode; keep the default ScrollToBottom and clear the tint too.
{ key = "i", mode = "Vi|~Search", action = "ToggleViMode" },
{ key = "i", mode = "Vi|~Search", action = "ScrollToBottom" },
{ key = "i", mode = "Vi|~Search", command = { program = "sh", args = ["-c", "exec \"$HOME/.config/alacritty/vi-mode-bg.sh\""] } },
# Ctrl+C also leaves vi mode.
{ key = "c", mods = "Control", mode = "Vi|~Search", action = "ToggleViMode" },
{ key = "c", mods = "Control", mode = "Vi|~Search", command = { program = "sh", args = ["-c", "exec \"$HOME/.config/alacritty/vi-mode-bg.sh\""] } },
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]
