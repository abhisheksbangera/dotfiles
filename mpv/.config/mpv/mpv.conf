# uosc + thumbfast integration
osc=no
osd-bar=no
border=no

# optional: smoother UI, slightly higher CPU/GPU
# video-sync=display-resample

# Subtitle size: 1.0 = default, 0.8 = 20% smaller.
sub-scale=0.8

# Save the playback position on any quit (q, Ctrl+c, closing the window) and
# seek back to it when the same file is opened again.
save-position-on-quit=yes

# Key the saved position on the file NAME only, not its full path/URL, so a file
# still resumes after being moved/renamed to another folder.
# Caveat: two files with the same name in different folders share one position.
# Also silences the per-directory "# redirect entry" stubs.
ignore-path-in-watch-later-config=yes
