# Portable Hyprland config.
# No bar or app launcher configured — add your own exec-once and binds below.
# Adjust `monitor=` to your outputs (see `hyprctl monitors all`).

$terminal = alacritty
$browser = firefox
$editor = nvim
$fileManager = nautilus
$calculator = gnome-calculator

env = GDK_SCALE,1
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

monitor = ,preferred,auto,1.25
# Examples:
# monitor = DP-2,2560x1440@144,0x0,1
# monitor = DP-2,preferred,auto,1,transform,1   # portrait secondary

exec-once = hyprctl setcursor Bibata-Modern-Ice 20
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

general {
  gaps_in = 3
  gaps_out = 5
  border_size = 3
  layout = dwindle
  resize_on_border = true
  col.active_border = rgb(89b4fa)
  col.inactive_border = rgb(45475a)
}

decoration {
  rounding = 8
  active_opacity = 1.0
  inactive_opacity = 0.96
  shadow {
    enabled = false
  }
  blur {
    enabled = true
    size = 6
    passes = 2
  }
}

animations {
  enabled = true
}

input {
  kb_options = shift:both_capslock_cancel
  repeat_rate = 40
  repeat_delay = 250
  touchpad {
    natural_scroll = true
    clickfinger_behavior = false
    disable_while_typing = true
  }
}

# No gaps/borders on single-window workspaces
workspace = w[tv1], gapsout:0, gapsin:0, border:0, rounding:0
workspace = f[1], gapsout:0, gapsin:0, border:0, rounding:0

windowrule = float, class:^(org.gnome.Calculator|gnome-calculator)$

# --- Launchers ---
bind = SUPER, B, exec, $browser
bind = SUPER SHIFT, B, exec, $browser --private-window
bind = SUPER, M, exec, mullvad-browser || xdg-open https://mullvad.net
bind = SUPER, Y, exec, stremio-enhanced || stremio
bind = SUPER, Q, killactive
bind = SUPER CTRL, Q, exec, $calculator
bind = , XF86Calculator, exec, $calculator
bind = SUPER, A, exec, $terminal -e opencode
# No app launcher bound — add one, e.g. bind = SUPER, SPACE, exec, <your-launcher>
bind = SUPER, SLASH, exec, $terminal -e sh -c 'hyprctl binds | less'

# --- Focus (vim-style) ---
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER, UP, togglesplit
bind = SUPER ALT, F, fullscreen, 1

# --- Swap (vim-style) ---
bind = SUPER SHIFT, H, swapwindow, l
bind = SUPER SHIFT, L, swapwindow, r
bind = SUPER SHIFT, K, swapwindow, u
bind = SUPER SHIFT, J, swapwindow, d

# --- Workspaces 1-9 ---
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# --- System ---
bind = F7, exec, ~/.config/hypr/scripts/mullvad-toggle.sh
bindl = CTRL, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/brightness.sh +10%
bindl = CTRL, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/brightness.sh 10%-
bindl = CTRL ALT, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/brightness.sh +1%
bindl = CTRL ALT, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/brightness.sh 1%-

# Screenshots (grim + slurp + wl-copy)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
